webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "--incognito",
        "--start-maximized",
        "--disable-popup-blocking",
        "--disable-infobars",
        "--disable-gpu",
        "--disable-dev-shm-usage",
        "--no-sandbox",
        "--remote-allow-origins=*"
      ]
    }
  }
}

serenity {
  take.screenshots = AFTER_EACH_STEP
}

headless.mode = false